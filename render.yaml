services:
  - type: web
    name: manga-translator
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && python3 -m venv .venv && .venv/bin/pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu && .venv/bin/pip install --no-cache-dir -r requirements.txt && .venv/bin/python python/prepare_model.py && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
